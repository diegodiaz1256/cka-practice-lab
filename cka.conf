# CKA lab configuration.
#
# Defaults below work out of the box on any machine with Docker: the cluster is
# created on localhost and reached through a kind-assigned port. Nothing else to do.
#
# To expose the cluster on your network (VPN, homelab DNS, another host), copy this
# file to cka.conf.local and change the values there. cka.conf.local is gitignored,
# so your setup stays yours and does not end up in commits.

# Name of the kind cluster.
CLUSTER_NAME=cka-practice

# Kubernetes version. Should track the version the CKA exam is on - check
# https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/
NODE_IMAGE=kindest/node:v1.35.8

# Address the API server binds to.
#   127.0.0.1  - local only (default, works everywhere)
#   <some IP>  - an address on this host, to reach the cluster from other machines
API_ADDRESS=127.0.0.1

# Port the API server listens on. 0 lets kind pick a free one - fine for local use.
# Set a fixed port if you are reaching it from elsewhere.
API_PORT=6443

# Hostname clients use in their kubeconfig. Leave empty to use API_ADDRESS.
# If you set this, it is added to the API server certificate, so kubectl can verify
# TLS when connecting by name. You are responsible for making the name resolve.
API_HOST=

# Extra names/IPs to put in the API server certificate, comma separated.
# Useful if the cluster is reachable several ways (LAN IP, VPN IP, DNS name).
EXTRA_SANS=
